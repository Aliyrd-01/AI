<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lead Form</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 40px auto; padding: 20px; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #00a6ff; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0088cc; }
    #status { margin-top: 16px; padding: 12px; border-radius: 4px; display: none; }
    .success { background: #d4edda; color: #155724; display: block !important; }
    .error { background: #f8d7da; color: #721c24; display: block !important; }
  </style>
</head>
<body>
  <h2>Lead Form</h2>
  <form id="leadForm">
    <label>Name *</label>
    <input type="text" id="name" required>

    <label>Email *</label>
    <input type="email" id="email" required>

    <label>Phone</label>
    <input type="tel" id="phone" placeholder="+380501234567">

    <label>Company</label>
    <input type="text" id="company" placeholder="Google, Microsoft...">

    <label>Position</label>
    <input type="text" id="position" placeholder="CTO, CEO, Developer...">

    <label>Message</label>
    <textarea id="message" rows="4" placeholder="What are you interested in?"></textarea>

    <button type="submit">Send Lead</button>
  </form>
  <div id="status"></div>

  <script>
    document.getElementById('leadForm').onsubmit = async function(e) {
      e.preventDefault();
      const status = document.getElementById('status');
      status.className = '';
      status.style.display = 'block';
      status.textContent = 'Sending...';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        company: document.getElementById('company').value,
        position: document.getElementById('position').value,
        message: document.getElementById('message').value,
        source: 'web'
      };

      try {
        const res = await fetch('/send-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          status.className = 'success';
          status.textContent = 'Lead sent! Check your Telegram/Email for notification.';
          this.reset();
        } else {
          status.className = 'error';
          status.textContent = 'Error: ' + res.status;
        }
      } catch (err) {
        status.className = 'error';
        status.textContent = 'Connection error: ' + err.message;
      }
    };
  </script>
</body>
</html>
